services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nxb
      POSTGRES_PASSWORD: nxb_secret
      POSTGRES_DB: nxb_chatbot
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"    # REST API
      - "6334:6334"    # gRPC
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  pg_data:
  qdrant_data: