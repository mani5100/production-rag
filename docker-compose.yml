services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/6333"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://nxb:nxb_secret@postgres:5432/nxb_chatbot
      CHECKPOINTER_DATABASE_URL: postgresql://nxb:nxb_secret@postgres:5432/nxb_chatbot
      QDRANT_URL: http://qdrant:6333
    volumes:
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy 

  tts:
    build:
      context: .
      dockerfile: Dockerfile
    command:
      [
        "uv",
        "run",
        "uvicorn",
        "nxb_chatbot.tts.app:app",
        "--host",
        "0.0.0.0",
        "--port",
        "5000",
      ]
    ports:
      - "5000:5000"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    command:
      [
        "uv",
        "run",
        "chainlit",
        "run",
        "/app/src/nxb_chatbot/frontend/app.py",
        "--host",
        "0.0.0.0",
        "--port",
        "8001",
        "-h",
      ]
    ports:
      - "8001:8001"
    env_file:
      - .env
    environment:
      API_BASE_URL: http://app:8000/api/v1
      TTS_WEBSOCKET_URL: ws://localhost:5000/ws/speech
      DATABASE_URL: ""
    volumes:
      - ./src/nxb_chatbot/frontend/public:/app/public
    depends_on:
      app:
        condition: service_started
      tts:
        condition: service_started
    restart: unless-stopped

volumes:
  pg_data:
  qdrant_data: