[project]
name = "nxb-chatbot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Abdul Rehman", email = "m.abdulrehman.shoukat@gmial.com" }
]
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.18.5",
    "asyncpg>=0.31.0",
    "chainlit>=2.11.1",
    "fastapi>=0.140.0",
    "fastembed>=0.8.0",
    "flashrank>=0.2.10",
    "google-api-python-client>=2.198.0",
    "google-auth>=2.56.2",
    "httpx>=0.28.1",
    "langchain>=1.3.14",
    "langchain-community>=0.4.2",
    "langchain-openai>=1.4.1",
    "langchain-pymupdf4llm>=1.28.0",
    "langchain-qdrant>=1.1.0",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.2.9",
    "langgraph-checkpoint-postgres>=3.1.0",
    "pdfplumber>=0.11.10",
    "psycopg>=3.3.4",
    "psycopg-pool>=3.3.1",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.2.2",
    "qdrant-client>=1.18.0",
    "sqlalchemy[asyncio]>=2.0.51",
    "uvicorn[standard]>=0.51.0",
]

[project.scripts]
nxb-chatbot = "nxb_chatbot:main"

[build-system]
requires = ["uv-build>=0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.0",
]
